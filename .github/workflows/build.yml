name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy web app into the Android app
        run: |
          mkdir -p app/src/main/assets/www
          cp -r docs/. app/src/main/assets/www/
          rm -f app/src/main/assets/www/sw.js
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk mutalaa.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mutalaa-APK
          path: mutalaa.apk
      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: مطالعة — آخر نسخة
          body: "حمّل ملف mutalaa.apk وثبّته على هاتف أندرويد."
          files: mutalaa.apk
          make_latest: true
